name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]

env:
  DOCKER_IMAGE: secure-app
  REGISTRY_NAME: docker.io

jobs:
  devsecops-delivery:
    runs-on: ubuntu-latest
    steps:
    - name: Fetch Repository Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Gate 1: Code Linting & Unit Testing Mock Verification
    - name: Execute Code Linting & Verification
      run: |
        echo "Running structural syntax checks..."
        echo "Running application unit testing sequences..."
        echo "Source code state verified successfully!"

    # Gate 2: Static Application Security Testing (SAST via Native CLI)
    - name: Setup Java Environment for Scanner
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Run SonarScanner Native CLI
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        mkdir -p /opt/sonar-scanner
        curl -sSLo sonar-scanner.zip https://sonarsource.com
        unzip -q sonar-scanner.zip
        ./sonar-scanner-6.2.1.4610-linux-x64/bin/sonar-scanner \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.token=$SONAR_TOKEN \
          -Dsonar.projectKey=high-velocity-pipeline \
          -Dsonar.sources=.

    # Gate 3: Package, Containerize, and Scan Image Layers
    - name: Build Code Container Runtime Layers
      run: docker build -t $REGISTRY_NAME/$DOCKER_IMAGE:${{ github.sha }} .

    - name: Run Trivy Vulnerability Scan Inspector
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'docker.io/secure-app:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL'
