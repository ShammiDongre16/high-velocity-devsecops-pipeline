name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Fetch Repository Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required by SonarQube for accurate file analysis

    # Gate 1: Code Linting & Unit Testing Mock Stage
    - name: Run Quality Gate Checks
      run: |
        echo "Running Code Linters..."
        echo "Running Application Unit Tests..."
        echo "Quality gates passed successfully!"

    # Gate 2: Static Application Security Testing (SAST)
    - name: SonarQube Code Scan
      uses: sonarsource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

