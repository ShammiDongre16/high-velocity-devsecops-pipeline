name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: secure-app
  REGISTRY_NAME: ghcr.io
  LOWERCASE_OWNER: shammidongre16 # Forcing the repository path to remain lowercase

jobs:
  devsecops-delivery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Fetch Repository Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Gate 1: Code Linting & Unit Testing Mock Verification
    - name: Execute Code Linting & Verification
      run: |
        echo "Running structural syntax checks..."
        echo "Running application unit testing sequences..."
        echo "Source code state verified successfully!"

    # Gate 2: Static Application Security Testing (SAST)
    - name: Run Official SonarQube Analysis Scan
      uses: sonarsource/sonarqube-scan-action@v3
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: -Dsonar.projectKey=high-velocity-pipeline -Dsonar.sources=.

    # Gate 3: Package, Containerize, and Scan Image Layers
    - name: Build Code Container Runtime Layers
      run: docker build -t $REGISTRY_NAME/$LOWERCASE_OWNER/$DOCKER_IMAGE:${{ github.sha }} .

    - name: Run Trivy Vulnerability Scan Inspector
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'ghcr.io/shammidongre16/secure-app:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        severity: 'CRITICAL'

    # Gate 4: Trusted Distribution Artifact Storage
    - name: Authenticate to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Secure Immutable Image to Registry
      run: docker push $REGISTRY_NAME/$LOWERCASE_OWNER/$DOCKER_IMAGE:${{ github.sha }}
